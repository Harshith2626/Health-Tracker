services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: health-valut-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=health-valut-production-secret-change-me
      - JWT_EXPIRES_IN=7d
      - PORT=5000
      - NODE_ENV=production
      - CORS_ORIGIN=http://localhost:80,http://localhost:5173,*
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - backend-uploads:/app/uploads
      - backend-db:/app/prisma

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:5000/api
    container_name: health-valut-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  backend-uploads:
  backend-db:
